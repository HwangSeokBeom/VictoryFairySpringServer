server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: victoryfairy-spring-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/victoryfairy-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: ${PROFILE_IMAGE_MAX_BYTES:2097152}
      max-request-size: ${PROFILE_IMAGE_MAX_BYTES:2097152}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

victory-fairy:
  kbo:
    source-label-mode: ${KBO_SOURCE_LABEL_MODE:dev}
    scraped-dev:
      enabled: ${KBO_SCRAPED_DEV_ENABLED:true}
      input-json: ${KBO_SCRAPED_DEV_INPUT_JSON:/Users/hwangseokbeom/Documents/GitHub/VictoryFairyCoreServer/input/kbo-scraper-2026.json}
      scheduler-enabled: ${KBO_SCRAPED_DEV_SCHEDULER_ENABLED:false}
      schedule-cron: ${KBO_SCRAPED_DEV_SCHEDULE_CRON:0 23 * * *}
      season: ${KBO_SCRAPED_DEV_SEASON:2026}
      min-interval-hours: ${KBO_SCRAPED_DEV_MIN_INTERVAL_HOURS:20}
      state-path: ${KBO_SCRAPED_DEV_STATE_PATH:data/kbo/kbo_scraped_dev_update_state.json}
      admin-import-token: ${ADMIN_IMPORT_TOKEN:}
      request-delay-ms: ${KBO_SCRAPED_DEV_REQUEST_DELAY_MS:350}
  ai:
    diary-enabled: ${AI_DIARY_ENABLED:false}
    match-outlook-enabled: ${MATCH_OUTLOOK_AI_ENABLED:false}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.1-8b-instant}
    daily-limit: ${AI_DIARY_DAILY_LIMIT:10}
    timeout-seconds: ${AI_DIARY_TIMEOUT_SECONDS:12}
  profile-image:
    upload-enabled: ${PROFILE_IMAGE_UPLOAD_ENABLED:true}
    max-bytes: ${PROFILE_IMAGE_MAX_BYTES:2097152}
    max-side: ${PROFILE_IMAGE_MAX_SIDE:512}
    upload-dir: ${PROFILE_IMAGE_UPLOAD_DIR:data/uploads/profile}
  community:
    enabled: ${COMMUNITY_ENABLED:true}
    posts-require-profile: ${COMMUNITY_POSTS_REQUIRE_PROFILE:true}
    block-enabled: ${COMMUNITY_BLOCK_ENABLED:true}
    policy-url: ${COMMUNITY_POLICY_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/community-policy.html}
  legal:
    app-homepage-url: ${APP_HOMEPAGE_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/}
    terms-url: ${TERMS_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/terms.html}
    privacy-policy-url: ${PRIVACY_POLICY_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/privacy.html}
    support-url: ${SUPPORT_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/support.html}
    account-deletion-url: ${ACCOUNT_DELETION_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/delete-account.html}
    disclaimer-url: ${DISCLAIMER_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/disclaimer.html}
    community-policy-url: ${COMMUNITY_POLICY_URL:https://hwangseokbeom.github.io/VictoryFairy-legal/community-policy.html}
  news:
    provider: ${NEWS_PROVIDER:local}
    naver-client-id: ${NAVER_CLIENT_ID:}
    naver-client-secret: ${NAVER_CLIENT_SECRET:}
    naver-news-base-url: ${NAVER_NEWS_BASE_URL:https://openapi.naver.com/v1/search/news.json}
    cache-ttl-seconds: ${NEWS_CACHE_TTL_SECONDS:1800}

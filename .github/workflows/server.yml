name: Server

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit and integration tests
        run: ./gradlew test
      - name: Build executable artifact
        run: ./gradlew bootJar
      - name: PostgreSQL migration and restart rehearsal
        run: scripts/rehearse_postgres_migration.sh
      - name: Secret and patch hygiene
        run: |
          scripts/scan_sensitive_patterns.sh
          git diff --check
